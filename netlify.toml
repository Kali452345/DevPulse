[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Redirect /api/* to Netlify Functions
[[redirects]]
  from = "/api/hn"
  to = "/.netlify/functions/hn"
  status = 200

[[redirects]]
  from = "/api/devto"
  to = "/.netlify/functions/devto"
  status = 200

[[redirects]]
  from = "/api/ai-news"
  to = "/.netlify/functions/ai-news"
  status = 200

[[redirects]]
  from = "/api/lobsters"
  to = "/.netlify/functions/lobsters"
  status = 200

[[redirects]]
  from = "/api/github-trending"
  to = "/.netlify/functions/github-trending"
  status = 200

[[redirects]]
  from = "/api/scrape"
  to = "/.netlify/functions/scrape"
  status = 200

[[redirects]]
  from = "/api/summarize"
  to = "/.netlify/functions/summarize"
  status = 200

[[redirects]]
  from = "/api/generate-article"
  to = "/.netlify/functions/generate-article"
  status = 200

[[redirects]]
  from = "/api/articles"
  to = "/.netlify/functions/articles"
  status = 200

[[redirects]]
  from = "/api/status"
  to = "/.netlify/functions/status"
  status = 200

[context.production.environment]
  NODE_VERSION = "18"
